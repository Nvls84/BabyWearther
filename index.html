<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Baby Wea(r)ther</title>
  </head>
  <body>
    <h1>What should my baby wear?</h1>
    <div class="card">
      <div class="search">
        <input
          autofocus
          type="text"
          placeholder="Enter city here"
          spellcheck="false"
        />
        <button class="button">Search</button>
      </div>
      <div class="weather">
        <h1 class="temp">°C</h1>
        <h2 class="city">City</h2>
      </div>
    </div>
    <div>
      <!--insert API  here-->
    </div>
    <div class="advice">
      <p class="intro">Know before you go.</p>
      <p class="error" role="alert" hidden></p>
      <p class="wear"></p>
    </div>
    <footer class="note">
      *As a general rule,dress your baby in one more layer than you are wearing
      to feel comfortable. Always check your baby's chest or the back of their
      neck to ensure they aren’t too hot or cold.
    </footer>

    <!--script src="script.js"></script-->
  </body>
</html>
